[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-exporter"
version = "2.2.0"
description = "Trade history export, analytics and charts with Rust-backed libraries"
requires-python = ">=3.11"
dependencies = [
    "polars>=2.0.0,<3",
    "orjson>=3.13.0,<4",
    "primp>=2.0.1,<3",
    "fastexcel>=0.21.0,<0.22",
    "xlsxturbo>=1.11.0,<2",
    "python-dotenv>=1.2.4,<2",
    "tzdata>=2026.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trade-exporter = "trade_exporter.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
